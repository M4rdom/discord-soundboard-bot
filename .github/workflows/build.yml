name: Build executable and image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-executable:
    # Only on an explicit release (tag push or manual dispatch), not on every
    # commit to main — unlike the image below, this isn't meant to track
    # main continuously.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build executable
        run: >
          pyinstaller --onefile --name soundboard
          --collect-all nacl --hidden-import _cffi_backend
          src/main.py

      - name: Rename with environment suffix
        run: mv dist/soundboard dist/soundboard-linux

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-linux
          path: dist/soundboard-linux

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/soundboard-linux

  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Always tags "latest" and the commit sha; adds the version tag
      # (e.g. v1.0.0) when triggered by a tag push. Image names must be
      # lowercase, which this action handles even though the GitHub
      # username (M4rdom) isn't.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      # Uses a PAT (GHCR_PAT secret, "write:packages" scope) instead of the
      # default GITHUB_TOKEN: on personal (non-org) accounts, GITHUB_TOKEN can
      # keep getting "denied: permission_denied: write_package" on the first
      # push to a new package even with the repo's Workflow permissions set
      # to "Read and write" -- a PAT sidesteps that entirely.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
