name: Build standalone executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      # Only the Linux build bundles ffmpeg (see src/audio_mixer.py's
      # _ffmpeg_executable, which looks for it next to the PyInstaller-extracted
      # files at runtime). Linux has a trivial, official apt package to pull it
      # from; Windows doesn't ship ffmpeg on the runner and has no equivalent
      # first-party source, so bundling it there would mean downloading a
      # third-party static build in CI — recommend Docker on Windows instead
      # (see README's Option C), where the image already installs ffmpeg.
      - name: Install ffmpeg (Linux only, to bundle into the executable)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # --collect-all nacl / --hidden-import _cffi_backend are required: PyNaCl's
      # compiled _sodium extension is loaded through cffi, which PyInstaller's
      # static analysis doesn't detect on its own — without these flags the
      # executable silently loses voice support.
      - name: Build executable (Linux, with bundled ffmpeg)
        if: matrix.os == 'ubuntu-latest'
        run: >
          pyinstaller --onefile --name soundboard
          --collect-all nacl --hidden-import _cffi_backend
          --add-binary "$(command -v ffmpeg):."
          src/main.py

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          pyinstaller --onefile --name soundboard
          --collect-all nacl --hidden-import _cffi_backend
          src/main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
          path: dist/soundboard*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/soundboard*

  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Computes correctly-cased ghcr.io tags: always "latest", plus the
      # version tag (e.g. v1.0.0) when triggered by a tag push. Image names
      # must be lowercase, which this action handles even though the GitHub
      # username (M4rdom) isn't.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
