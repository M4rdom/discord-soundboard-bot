name: Build standalone executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Install ffmpeg (Linux only, to bundle into the executable)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build executable (Linux, with bundled ffmpeg)
        if: matrix.os == 'ubuntu-latest'
        run: >
          pyinstaller --onefile --name soundboard
          --collect-all nacl --hidden-import _cffi_backend
          --add-binary "$(command -v ffmpeg):."
          src/main.py

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          pyinstaller --onefile --name soundboard
          --collect-all nacl --hidden-import _cffi_backend
          src/main.py

      - name: Rename executable with environment suffix
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/soundboard.exe dist/soundboard-windows.exe
          else
            mv dist/soundboard dist/soundboard-linux
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundboard-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
          path: dist/soundboard-*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/soundboard-*

  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
